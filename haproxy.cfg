global
    log /dev/log local0
    maxconn 50000

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    option redispatch      # nếu server down, retry sang server khác

frontend https_in
    bind *:443
    mode tcp
    default_backend api_backends

frontend http_in
    bind *:80
    mode tcp
    default_backend api_backends_http

# Health check 2 VPS thật cho API (port 3000)
backend api_backends
    mode tcp
    balance leastconn
    option tcp-check
    server vps1 103.116.52.222:8443 check inter 5s fall 2 rise 3
    server vps2 103.116.52.219:8443 check inter 5s fall 2 rise 3

backend api_backends_http
    mode tcp
    balance leastconn
    option tcp-check
    server vps1 103.116.52.222:8080 check inter 5s fall 2 rise 3
    server vps2 103.116.52.219:8080 check inter 5s fall 2 rise 3

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node
    stats show-legends